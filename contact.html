<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Contact — 1988 Graphics. Email or WhatsApp to start a project." />
  <title>Contact — 1988 Graphics</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
</head>
<body>

  <header class="site-header">
    <nav class="nav" aria-label="Main navigation">
      <a href="index.html" class="nav__logo" aria-label="1988 Graphics — home">
        <img src="assets/images/1988-graphics-logo.svg" alt="" class="nav__logo-mark" width="36" height="16" />
        1988 Graphics
      </a>
      <button class="nav__toggle" aria-label="Open navigation" aria-expanded="false" aria-controls="nav-menu">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav__links" id="nav-menu" role="list">
        <li><a href="index.html"   class="nav__link">Work</a></li>
        <li><a href="about.html"   class="nav__link">About</a></li>
        <li><a href="contact.html" class="nav__link active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="contact-section has-halftone" aria-label="Contact">
      <div class="wrap">
        <div class="contact-page">

          <!-- Heading -->
          <div class="contact__head reveal">
            <p class="t-stamp">Get in touch</p>
            <h1 class="t-section-head contact__head-title">Let's work<br>together.</h1>
          </div>

          <!-- Primary contact buttons — Email + WhatsApp -->
          <div class="contact__actions reveal" data-delay="1">

            <!-- EMAIL — primary, filled button -->
            <a id="contact-email"
               href="#"
               class="contact-btn contact-btn--primary"
               aria-label="Send an email">
              <!-- Envelope icon -->
              <svg class="contact-btn__icon" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="2" y="4" width="20" height="16" rx="1"/>
                <path d="M2 7l10 7 10-7"/>
              </svg>
              <span class="contact-btn__text">
                <span class="contact-btn__label">Email</span>
                <span class="contact-btn__sub">Let's talk about your project.</span>
              </span>
            </a>

            <!-- WHATSAPP — secondary, outline button -->
            <a id="contact-whatsapp"
               href="#"
               class="contact-btn contact-btn--whatsapp"
               target="_blank"
               rel="noopener noreferrer"
               aria-label="Message on WhatsApp">
              <!-- WhatsApp icon -->
              <svg class="contact-btn__icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
              </svg>
              <span class="contact-btn__text">
                <span class="contact-btn__label">WhatsApp</span>
                <span class="contact-btn__sub">Message me directly.</span>
              </span>
            </a>

          </div>

          <!-- Instagram — tertiary -->
          <div class="contact__instagram reveal" data-delay="2">
            <p class="t-stamp" style="margin-bottom:1.25rem;">Also on Instagram</p>
            <a id="contact-instagram"
               href="#"
               class="contact__ig-link"
               target="_blank"
               rel="noopener noreferrer"
               aria-label="Follow on Instagram">
              <!-- Instagram icon -->
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
                <circle cx="12" cy="12" r="4"/>
                <circle cx="17.5" cy="6.5" r="0.01" fill="currentColor" stroke-width="2.5"/>
              </svg>
              <span id="contact-ig-handle">Instagram</span>
            </a>
          </div>

          <!-- Availability -->
          <div class="contact__avail reveal" data-delay="3" aria-label="Availability status">
            <span class="contact__avail-dot" aria-hidden="true"></span>
            <span class="contact__avail-text">Available for new projects</span>
          </div>

        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <div class="footer__inner">
        <span class="footer__logo">1988 Graphics<img src="assets/images/1988-graphics-logo.svg" alt="" class="footer__logo-mark" width="30" height="13" /></span>
        <nav class="footer__links" id="footer-links" aria-label="Footer links">
          <!-- Populated by JS from config.js -->
        </nav>
        <p class="footer__copy">&copy; <span id="year"></span> 1988 Graphics</p>
      </div>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
